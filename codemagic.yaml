# CI workflow for Floosy iOS TestFlight distribution.
#
# Required environment variables (add as Secure variables in
# codemagic.io -> App settings -> Environment variables):
#
#   GOOGLE_IOS_CLIENT_ID     iOS OAuth client ID (...apps.googleusercontent.com)
#   GOOGLE_SERVER_CLIENT_ID  Web application OAuth client ID
#   APP_STORE_CONNECT_PRIVATE_KEY       full contents of the App Store Connect .p8 key
#   APP_STORE_CONNECT_KEY_IDENTIFIER    Key ID of that key
#   APP_STORE_CONNECT_ISSUER_ID         Issuer ID of that key
#
# The App Store Connect API key must also be connected in Codemagic under
# App settings -> Integrations -> App Store Connect so that net.floosy.app is
# signed automatically (including the app-group entitlement).
workflows:
  ios-testflight:
    name: Floosy iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.floosy.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: false
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Inject Google sign-in URL scheme
        script: |
          if [ -z "$GOOGLE_IOS_CLIENT_ID" ] || [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "GOOGLE_IOS_CLIENT_ID and GOOGLE_SERVER_CLIENT_ID must be set"
            echo "in Codemagic: App settings -> Environment variables (Secure)."
            echo "Values are the iOS and Web application OAuth client IDs from"
            echo "Google Cloud Console -> APIs & Services -> Credentials."
            exit 1
          fi
          case "$GOOGLE_IOS_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "GOOGLE_IOS_CLIENT_ID must be the full iOS client ID ending"
              echo "in .apps.googleusercontent.com (got: $GOOGLE_IOS_CLIENT_ID)"
              exit 1
              ;;
          esac
          base="${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 com.googleusercontent.apps.$base" \
            ios/Runner/Info.plist
          echo "Injected Google URL scheme: com.googleusercontent.apps.$base"
      - name: Apply automatic code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-method app-store \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Verify Google URL scheme inside the built archive
        script: |
          app_plist=$(find build/ios/archive -name Info.plist -path "*Runner.app*" | head -1)
          scheme=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:1:CFBundleURLSchemes:0" "$app_plist")
          case "$scheme" in
            com.googleusercontent.apps.*REPLACE*|"")
              echo "Google URL scheme was not injected into the built app: '$scheme'"
              exit 1
              ;;
            *)
              echo "Archive carries Google URL scheme: $scheme"
              ;;
          esac
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
